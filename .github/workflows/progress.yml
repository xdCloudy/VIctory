name: Upstream progress monitor

on:
  push:
    branches: [feat/progress-tracker]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: upstream-progress
  cancel-in-progress: true

jobs:
  monitor:
    if: github.ref == 'refs/heads/feat/progress-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tracker branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: tracker
      - name: Checkout latest upstream main (read only)
        uses: actions/checkout@v5
        with:
          repository: Marvisak/VIctory
          ref: main
          fetch-depth: 25
          persist-credentials: false
          path: upstream
      - name: Test monitor
        run: python3 tracker/.github/scripts/upstream_progress.py --self-test
      - name: Read upstream CI check runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git -C upstream rev-parse HEAD)"
          if ! gh api "repos/Marvisak/VIctory/commits/${sha}/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"; then
            printf '{}\n' > "$RUNNER_TEMP/checks.json"
            echo "::warning::Upstream CI status unavailable"
          fi
      - name: Generate upstream dashboard
        run: |
          python3 tracker/.github/scripts/upstream_progress.py \
            --upstream upstream \
            --evidence tracker/.github/scripts/progress-evidence.json \
            --checks "$RUNNER_TEMP/checks.json" \
            --history 20 \
            --output "$RUNNER_TEMP/victory-monitor" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload dashboard and data
        uses: actions/upload-artifact@v4
        with:
          name: upstream-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/victory-monitor
          if-no-files-found: error
          retention-days: 90
