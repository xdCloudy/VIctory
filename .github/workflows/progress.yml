name: Progress

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test report generator
        run: cargo test --locked -p victory progress::tests
      - name: Check asset policy
        run: cargo xtask policy
      - name: Generate source-only dashboard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'victory-progress'
          cargo run --locked -p victory -- progress --output $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path (Join-Path $out 'complete.txt'))) { throw 'Incomplete report' }
          Set-Content (Join-Path $out 'revision.txt') $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: progress-${{ github.sha }}
          path: ${{ runner.temp }}/victory-progress
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VICTORY_PROGRESS_PAGES == 'true'
        with:
          path: ${{ runner.temp }}/victory-progress

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VICTORY_PROGRESS_PAGES == 'true'
    needs: report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy source-only dashboard
        id: deployment
        uses: actions/deploy-pages@v4
